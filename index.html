<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Primary SEO Metadata -->
    <title>Bubaé — Modern Fashion Within Your Budget | Official Online Store Bangladesh</title>
    <meta name="description" content="Shop the official Bubaé online store. Contemporary women's & girls' apparel within your budget. Cash on Delivery across all 64 districts in Bangladesh including Sylhet & Dhaka." />

    <meta name="author" content="Bubaé" />
    <link rel="canonical" href="https://bubae.com/" />
    
    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bubaé" />
    <meta property="og:title" content="Bubaé — Modern Fashion Within Your Budget | Official Store Bangladesh" />
    <meta property="og:description" content="Discover modern girls' and women's fashion at Bubaé. Shop stylish cargo pants, tailored blush trousers, and minimalist cotton tees with nationwide Cash on Delivery." />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bubaé — Modern Fashion Within Your Budget" />
    <meta name="twitter:description" content="Discover modern girls' and women's fashion at Bubaé. Shop stylish cargo pants, tailored blush trousers, and minimalist cotton tees with nationwide Cash on Delivery." />
    
    <!-- Typography & CDN Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Schema.org JSON-LD Structured Data for Technical SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ClothingStore",
          "@id": "https://bubae.com/#store",
          "name": "Bubaé",
          "alternateName": "Bubae Bangladesh",
          "url": "https://bubae.com",
          "description": "Modern fashion within your budget. Contemporary girls' and women's apparel with nationwide Cash on Delivery in Bangladesh.",
          "priceRange": "৳৳",
          "currenciesAccepted": "BDT",
          "paymentAccepted": "Cash on Delivery",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Sylhet",
            "addressRegion": "Sylhet Division",
            "addressCountry": "BD"
          },
          "areaServed": {
            "@type": "Country",
            "name": "Bangladesh"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://bubae.com/#website",
          "url": "https://bubae.com",
          "name": "Bubaé",
          "description": "Modern fashion within your budget. Girls' pants, minimalist tees, and relaxed fits.",

            "@id": "https://bubae.com/#store"
          }
        }
      ]
    }

  <body class="bg-[#FFF8F9] text-[#1E1E1E] antialiased selection:bg-[#F9C3D0] selection:text-[#1E1E1E]">
